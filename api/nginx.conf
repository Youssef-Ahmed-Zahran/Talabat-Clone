# Nginx Load Balancer Configuration for Production
# This file serves as documentation/template for deploying behind Nginx.

upstream talabat_api {
    # If running multiple containers or servers, list them here:
    # server 10.0.0.1:5000;
    # server 10.0.0.2:5000;
    
    # By default, local docker setup pointing to our scaled API
    server 127.0.0.1:5000; 
}

server {
    listen 80;
    server_name api.talabat-clone.com;

    # Rate limiting zone configured in http block (requires setup)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    location / {
        proxy_pass http://talabat_api;
        proxy_http_version 1.1;
        
        # Websocket support for Socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Forwarding real IP and Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        
        # Apply rate limiting
        # limit_req zone=api_limit burst=20 nodelay;
    }
}
